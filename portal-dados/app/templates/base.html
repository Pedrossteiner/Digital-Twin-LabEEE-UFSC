<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabEEE — Baixar dados</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --tx:#1d2330; --mut:#5f6b7c; --bd:#d9dee6; --ac:#1f6feb; --ac2:#e8f0fe; --err:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111217; --card:#181b1f; --tx:#e6e8eb; --mut:#9aa3af; --bd:#2c3038; --ac:#5794f2; --ac2:#1d2a40; --err:#f97066; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 32px auto; padding: 0 16px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { font-size: 22px; margin: 0; }
  .mut { color: var(--mut); font-size: 13px; }
  a { color: var(--ac); }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .linha { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  label.op { display:flex; gap:8px; align-items:flex-start; padding:6px 0; cursor:pointer; }
  label.op small { display:block; color:var(--mut); }
  input[type=date] { font:inherit; padding:6px 8px; border:1px solid var(--bd); border-radius:6px; background:var(--card); color:var(--tx); }
  .atalhos button { font:inherit; font-size:13px; border:1px solid var(--bd); background:transparent; color:var(--tx); border-radius:999px; padding:3px 10px; cursor:pointer; }
  .atalhos button:hover { border-color:var(--ac); color:var(--ac); }
  .seg { display:inline-flex; border:1px solid var(--bd); border-radius:8px; overflow:hidden; flex-wrap:wrap; }
  .seg label { padding:6px 12px; cursor:pointer; border-right:1px solid var(--bd); }
  .seg label:last-child { border-right:0; }
  .seg input { position:absolute; opacity:0; }
  .seg label:has(input:checked) { background:var(--ac2); color:var(--ac); font-weight:600; }
  .grade { display:grid; grid-template-columns: 170px 1fr; gap:14px 16px; align-items:center; }
  @media (max-width: 560px) { .grade { grid-template-columns: 1fr; } }
  .btn { font:inherit; font-weight:600; background:var(--ac); color:#fff; border:0; border-radius:8px; padding:10px 22px; cursor:pointer; }
  .btn:disabled { opacity:.6; cursor:wait; }
  .aviso { color:var(--err); }
  ul.mensal { list-style:none; padding:0; margin:0; display:flex; gap:10px; flex-wrap:wrap; }
  ul.mensal a { display:inline-block; border:1px solid var(--bd); border-radius:8px; padding:6px 12px; text-decoration:none; }
</style>
</head>
<body><main>{% block corpo %}{% endblock %}</main></body>
</html>
