[agent]
  interval = "10s"
  flush_interval = "10s"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "LabEEE"
  bucket = "LabEEE"

# Janelas e portas (zigbee2mqtt)
[[inputs.mqtt_consumer]]
  name_override = "zigbee"
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["zigbee2mqtt/+"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"

# Disponibilidade dos sensores zigbee (azul claro na planta)
[[inputs.mqtt_consumer]]
  name_override = "zigbee_disponibilidade"
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["zigbee2mqtt/+/availability"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  data_format = "value"
  data_type = "string"

# HOBOs (automacao do Home Assistant publica em lab/hobo/<serie>)
[[inputs.mqtt_consumer]]
  name_override = "ambiente"
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["lab/hobo/+"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  data_format = "json_v2"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "lab/hobo/+"
    tags = "_/_/serie"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      excluded_keys = ["serie"]

# Presenca dos PCs (Home Assistant publica em lab/presenca/<mesa>)
[[inputs.mqtt_consumer]]
  name_override = "presenca"
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["lab/presenca/+"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  data_format = "json_v2"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "lab/presenca/+"
    tags = "_/_/pc"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"

# Ar-condicionado Daikin (Home Assistant publica em lab/daikin/<unidade>)
[[inputs.mqtt_consumer]]
  name_override = "daikin"
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["lab/daikin/+"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  data_format = "json_v2"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "lab/daikin/+"
    tags = "_/_/unidade"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"

# Janelas e portas (Home Assistant publica em lab/janela/<NOME> a cada 10 min)
[[inputs.mqtt_consumer]]
  name_override = "janela"
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["lab/janela/+"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  data_format = "json_v2"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "lab/janela/+"
    tags = "_/_/nome"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
