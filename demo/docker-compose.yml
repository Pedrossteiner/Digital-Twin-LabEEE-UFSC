# Demo do Gêmeo Digital com dados simulados: não precisa do Home Assistant nem dos sensores.
#   cd demo && docker compose up -d --build
#   Grafana: http://localhost:3000 (admin / admin)  ·  Portal: http://localhost:8090  ·  3D: http://localhost:8090/gemeo3d
name: gemeo-demo
services:
  influxdb:
    image: influxdb:2.7
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=demo-gemeo-123
      - DOCKER_INFLUXDB_INIT_ORG=LabEEE
      - DOCKER_INFLUXDB_INIT_BUCKET=LabEEE
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=demo-token-gemeo
    ports: ["8086:8086"]

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      - GF_PLUGINS_PREINSTALL=nline-plotlyjs-panel@1.8.1
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - INFLUX_TOKEN=demo-token-gemeo
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [influxdb]

  simulador:
    build: { context: .., dockerfile: demo/simulador/Dockerfile }
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=demo-token-gemeo
    depends_on: [influxdb]

  portal:
    build: ../portal-dados
    environment:
      - DADOS_INFLUX_TOKEN=demo-token-gemeo
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_ORG=LabEEE
      - INFLUX_BUCKET=LabEEE
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_PUBLICO=http://localhost:3000
    ports: ["8090:8000"]
    depends_on: [influxdb, grafana]
