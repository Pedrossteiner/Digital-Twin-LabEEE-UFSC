- sensor:
  - name: "Total PCs Conectados"
    unique_id: total_pcs_conectados_lab
    icon: mdi:desktop-classic
    state_class: measurement
    unit_of_measurement: "PCs"
    state: >
      {% set pecs = [
        'switch.sonoff_11', 'switch.sonoff_12', 'switch.sonoff_13', 'switch.sonoff_14', 'switch.sonoff_15', 'switch.sonoff_16', 'switch.sonoff_17',
        'switch.sonoff_21', 'switch.sonoff_22', 'switch.sonoff_23', 'switch.sonoff_24', 'switch.sonoff_25', 'switch.sonoff_26', 'switch.sonoff_27',
        'switch.sonoff_31', 'switch.sonoff_32', 'switch.sonoff_33', 'switch.sonoff_34', 'switch.sonoff_35', 'switch.sonoff_36', 'switch.sonoff_37',
        'switch.sonoff_41', 'switch.sonoff_42', 'switch.sonoff_43', 'switch.sonoff_44', 'switch.sonoff_45', 'switch.sonoff_46', 'switch.sonoff_47',
        'switch.sonoff_51', 'switch.sonoff_52', 'switch.sonoff_53', 'switch.sonoff_54',
        'switch.sonoff_61', 'switch.sonoff_62', 'switch.sonoff_63', 'switch.sonoff_64'
      ] %}
      {{ pecs | reject('is_state', 'unavailable') | reject('is_state', 'unknown') | list | count }}

- sensor:
    - name: "Temperatura Média Lab"
      unique_id: lab_temp_media
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      state: >
        {% set ids = [
          'sensor.onset20589702','sensor.onset20589706','sensor.onset20589709',
          'sensor.onset20589716','sensor.onset20589717','sensor.onset20589721',
          'sensor.onset20589722','sensor.onset20589725','sensor.onset20589729',
          'sensor.onset20589732','sensor.onset20589733','sensor.onset20589738',
          'sensor.onset20589744','sensor.onset20589761',
          'sensor.onset20590558','sensor.onset20590559','sensor.onset20590561',
          'sensor.onset20590562','sensor.onset20590564'] %}
        {% set ns = namespace(v=[]) %}
        {% for s in expand(ids) %}
          {% if s.attributes.Temperature is defined and (now() - s.last_updated).total_seconds() < 1800 %}
            {% set ns.v = ns.v + [s.attributes.Temperature | float] %}
          {% endif %}
        {% endfor %}
        {{ (ns.v | sum / ns.v | length) | round(2) if ns.v else none }}

    - name: "Temperatura Máxima Lab"
      unique_id: lab_temp_max
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      state: >
        {% set ids = [
          'sensor.onset20589702','sensor.onset20589706','sensor.onset20589709',
          'sensor.onset20589716','sensor.onset20589717','sensor.onset20589721',
          'sensor.onset20589722','sensor.onset20589725','sensor.onset20589729',
          'sensor.onset20589732','sensor.onset20589733','sensor.onset20589738',
          'sensor.onset20589744','sensor.onset20589761',
          'sensor.onset20590558','sensor.onset20590559','sensor.onset20590561',
          'sensor.onset20590562','sensor.onset20590564'] %}
        {% set ns = namespace(v=[]) %}
        {% for s in expand(ids) %}
          {% if s.attributes.Temperature is defined and (now() - s.last_updated).total_seconds() < 1800 %}
            {% set ns.v = ns.v + [s.attributes.Temperature | float] %}
          {% endif %}
        {% endfor %}
        {{ ns.v | max if ns.v else none }}

    - name: "Temperatura Mínima Lab"
      unique_id: lab_temp_min
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      state: >
        {% set ids = [
          'sensor.onset20589702','sensor.onset20589706','sensor.onset20589709',
          'sensor.onset20589716','sensor.onset20589717','sensor.onset20589721',
          'sensor.onset20589722','sensor.onset20589725','sensor.onset20589729',
          'sensor.onset20589732','sensor.onset20589733','sensor.onset20589738',
          'sensor.onset20589744','sensor.onset20589761',
          'sensor.onset20590558','sensor.onset20590559','sensor.onset20590561',
          'sensor.onset20590562','sensor.onset20590564'] %}
        {% set ns = namespace(v=[]) %}
        {% for s in expand(ids) %}
          {% if s.attributes.Temperature is defined and (now() - s.last_updated).total_seconds() < 1800 %}
            {% set ns.v = ns.v + [s.attributes.Temperature | float] %}
          {% endif %}
        {% endfor %}
        {{ ns.v | min if ns.v else none }}