        ''climate.daikin_1_04'', ''climate.daikin_1_05'', ''climate.daikin_1_06'']
        | reject(''is_state'', ''off'') | reject(''is_state'', ''unavailable'') |
        reject(''is_state'', ''unknown'') | list) | map(''state_attr'', ''friendly_name'')
        | join('', '') }}. Abertas: {{ [''binary_sensor.1a_contact'', ''binary_sensor.2a_contact'',
        ''binary_sensor.3a_contact'', ''binary_sensor.4a_contact'', ''binary_sensor.5a_contact'',
        ''binary_sensor.6a_contact'', ''binary_sensor.7a_contact'', ''binary_sensor.8a_contact'',
