- id: alerta_ar_fora_horario
  alias: 'Alerta: ar ligado fora do horário'
  description: Avisa se alguma evaporadora fica ligada por 15 min depois das 20h,
    antes das 7h ou no fim de semana.
  triggers:
  - trigger: template
    for:
