- id: publicar_daikin_mqtt
  alias: Publicar Daikin no MQTT
  description: Publica em lab/daikin/<unidade> o estado de cada evaporadora Daikin
    (ligado, setpoint, temperatura de retorno, modo, ventilador, filtro). Usado pelo
    Telegraf/Grafana.
  triggers:
  - trigger: state
    entity_id:
    - climate.daikin_1_00
    - climate.daikin_1_01
    - climate.daikin_1_02
    - climate.daikin_1_03
    - climate.daikin_1_04
    - climate.daikin_1_05
    - climate.daikin_1_06
    - climate.daikin_1_07
    - climate.daikin_1_08
    to:
  - trigger: time_pattern
    minutes: /10
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - repeat:
      for_each:
      - climate.daikin_1_00
      - climate.daikin_1_01
      - climate.daikin_1_02
      - climate.daikin_1_03
      - climate.daikin_1_04
      - climate.daikin_1_05
      - climate.daikin_1_06
      - climate.daikin_1_07
      - climate.daikin_1_08
      sequence:
      - action: mqtt.publish
        data:
          topic: lab/daikin/{{ repeat.item | replace('climate.daikin_','') }}
          payload: '{% set u = repeat.item | replace(''climate.daikin_'','''') %}{"ligado":
            {{ 0 if is_state(repeat.item, ''off'') or is_state(repeat.item, ''unavailable'')
            else 1 }}, "disponivel": {{ 0 if is_state(repeat.item, ''unavailable'')
            else 1 }}, "setpoint": {{ state_attr(repeat.item, ''temperature'') | float(0)
            }}, "temp_retorno": {{ state_attr(repeat.item, ''current_temperature'')
            | float(0) }}, "modo": "{{ states(''select.daikin_'' ~ u ~ ''_mode'')
            | lower }}", "ventilador": "{{ states(''select.daikin_'' ~ u ~ ''_fan_speed'')
            | lower }}", "filtro_sujo": {{ 1 if is_state(''binary_sensor.daikin_''
            ~ u ~ ''_filter_warning'', ''on'') else 0 }}}'
          retain: true
  mode: queued
  max: 10
- id: alerta_ar_janela_aberta
