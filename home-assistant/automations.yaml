- id: alerta_co2_alto
  alias: 'Alerta: CO2 acima de 1000 ppm'
  description: Avisa quando algum MX1102 passa de 1000 ppm por 15 min (pede ventilação).
  triggers:
  - trigger: template
    value_template: '{{ [''sensor.onset20590558'', ''sensor.onset20590559'', ''sensor.onset20590561'',
      ''sensor.onset20590562'', ''sensor.onset20590564''] | map(''state_attr'', ''CO2'')
      | map(''float'', 0) | max > 1000 }}'
    for:
      minutes: 15
  conditions: []
  actions:
  - action: persistent_notification.create
    data:
      notification_id: alerta_co2
      title: CO2 alto no salão
      message: '{% for s in [''sensor.onset20590558'', ''sensor.onset20590559'', ''sensor.onset20590561'',
        ''sensor.onset20590562'', ''sensor.onset20590564''] if state_attr(s, ''CO2'')
        | float(0) > 1000 %}MX1102 {{ s | replace(''sensor.onset'', '''') }}: {{ state_attr(s,
        ''CO2'') }} ppm. {% endfor %}Vale abrir janelas ou aumentar a ventilação.'
  - action: notify.labeee
    data:
      title: CO2 alto no salão
