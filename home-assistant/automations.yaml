- id: alerta_shelly_offline
  alias: 'Alerta: Shelly (gateway BLU) offline'
  description: Avisa no Slack quando um dos gateways Shelly BLU (que trazem os HOBO
    de cada bancada) fica 10 min sem responder, e avisa de novo quando ele volta.
    Usa a entidade de firmware do Shelly, que fica indisponível quando o aparelho
    cai.
  triggers:
  - trigger: state
    entity_id:
    - update.shelly_1_firmware
    - update.teste_adaptador_bluetooth_para_sensores_shellyblu_2_31_44_firmware
    - update.shellyblu_3_11_24_firmware
    - update.shellyblu_4_15_27_firmware
    - update.shellyblu_5_35_47_firmware
    - update.shellyblu_sala_de_reunioes_2_firmware
    to: unavailable
    for:
      minutes: 10
    id: caiu
  - trigger: state
    entity_id:
    - update.shelly_1_firmware
    - update.teste_adaptador_bluetooth_para_sensores_shellyblu_2_31_44_firmware
    - update.shellyblu_3_11_24_firmware
    - update.shellyblu_4_15_27_firmware
    - update.shellyblu_5_35_47_firmware
    - update.shellyblu_sala_de_reunioes_2_firmware
    from: unavailable
    id: voltou
  conditions:
  - condition: template
    value_template: '{{ trigger.id == ''caiu'' or (trigger.to_state.state not in [''unavailable'',''unknown'']
      and (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()
      >= 600) }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: caiu
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: shelly_offline_{{ trigger.entity_id }}
          title: Shelly offline
          message: '{% set d = device_id(trigger.entity_id) %}{{ device_attr(d, ''name_by_user'')
            or device_attr(d, ''name'') }} está sem responder desde {{ trigger.from_state.last_changed
            | as_local | as_timestamp | timestamp_custom(''%H:%M'') }}. Os HOBO dessa
            bancada param de chegar até ele voltar. Confira se está na tomada e no
            Wi-Fi.'
      - action: notify.labeee
        data:
          title: Shelly offline
          target:
          - SLACK_ID_PESSOA_1
          - SLACK_ID_PESSOA_2
          message: "\U0001F4E1 *Shelly offline* — {% set d = device_id(trigger.entity_id)
            %}{{ device_attr(d, 'name_by_user') or device_attr(d, 'name') }} está
            sem responder há 10 min (desde {{ trigger.from_state.last_changed | as_local
            | as_timestamp | timestamp_custom('%H:%M') }}). Os HOBO dessa bancada
            param de chegar até ele voltar. Confira se está na tomada e no Wi-Fi."
    - conditions:
      - condition: trigger
        id: voltou
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: shelly_offline_{{ trigger.entity_id }}
      - action: notify.labeee
        data:
          title: Shelly de volta
          target:
          - SLACK_ID_PESSOA_1
          - SLACK_ID_PESSOA_2
          message: ✅ *Shelly de volta* — {% set d = device_id(trigger.entity_id) %}{{
            device_attr(d, 'name_by_user') or device_attr(d, 'name') }} voltou a responder
            depois de {{ ((trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()
            / 60) | round(0) | int }} min fora.
  mode: parallel
