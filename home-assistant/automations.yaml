    value_template: '{{ (now().hour >= 20 or now().hour < 7 or now().weekday() >=
      5) and ([''climate.daikin_1_00'', ''climate.daikin_1_01'', ''climate.daikin_1_02'',
      ''climate.daikin_1_03'', ''climate.daikin_1_04'', ''climate.daikin_1_05'', ''climate.daikin_1_06'',
      ''climate.daikin_1_07'', ''climate.daikin_1_08''] | reject(''is_state'', ''off'')
      | reject(''is_state'', ''unavailable'') | reject(''is_state'', ''unknown'')
      | list) | count > 0 }}'
  conditions: []
  actions:
  - action: persistent_notification.create
    data:
