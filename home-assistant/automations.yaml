            }} voltou a mandar dados depois de {{ (((trigger.to_state.state | as_datetime)
            - (trigger.from_state.state | as_datetime)).total_seconds() / 3600) |
            round(1) }} h sem leitura.
  mode: parallel
- id: alerta_servidor_fora_do_ar
  alias: 'Alerta: servidor do Gêmeo Digital fora do ar'
  description: 'Avisa no Slack quando o mini PC do servidor (ping em IP_DO_SERVIDOR),
    o Grafana ou o InfluxDB ficam 5 min sem responder, e quando voltam. Os dois últimos
    vêm do rest: no configuration.yaml (12/11/2026).'
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.192_168_0_134
    - binary_sensor.servidor_grafana_respondendo
    - binary_sensor.servidor_influxdb_respondendo
    to:
    - 'off'
    - unavailable
    for:
      minutes: 5
    id: caiu
  - trigger: state
    entity_id:
    - binary_sensor.192_168_0_134
    - binary_sensor.servidor_grafana_respondendo
    - binary_sensor.servidor_influxdb_respondendo
    from:
    - 'off'
    - unavailable
    to: 'on'
    id: voltou
  conditions:
  - condition: template
    value_template: '{{ trigger.id == ''caiu'' or (trigger.to_state.last_changed -
      trigger.from_state.last_changed).total_seconds() >= 300 }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: caiu
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: servidor_{{ trigger.entity_id }}
          title: Servidor do Gêmeo Digital fora do ar
          message: '{{ {''binary_sensor.192_168_0_134'':''o mini PC do servidor (não
            responde ao ping)'',''binary_sensor.servidor_grafana_respondendo'':''o
            Grafana'',''binary_sensor.servidor_influxdb_respondendo'':''o InfluxDB''}[trigger.entity_id]
            }} não responde desde {{ trigger.from_state.last_changed | as_local |
            as_timestamp | timestamp_custom(''%d/%m %H:%M'') }}.'
      - action: notify.labeee
        data:
          title: Servidor fora do ar
          target:
          - SLACK_ID_PESSOA_1
          - SLACK_ID_PESSOA_2
          message: "\U0001F5A5️ *Servidor do Gêmeo Digital* — {{ {'binary_sensor.192_168_0_134':'o
            mini PC do servidor (não responde ao ping)','binary_sensor.servidor_grafana_respondendo':'o
            Grafana','binary_sensor.servidor_influxdb_respondendo':'o InfluxDB'}[trigger.entity_id]
            }} não responde há 5 min (desde {{ trigger.from_state.last_changed | as_local
            | as_timestamp | timestamp_custom('%d/%m %H:%M') }}). Os dados param de
            ser gravados enquanto isso. Confira o servidor (`docker ps` em ~/teste)."
    - conditions:
      - condition: trigger
        id: voltou
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: servidor_{{ trigger.entity_id }}
      - action: notify.labeee
        data:
          title: Servidor de volta
          target:
          - SLACK_ID_PESSOA_1
          - SLACK_ID_PESSOA_2
          message: ✅ *Servidor de volta* — {{ {'binary_sensor.192_168_0_134':'o mini
            PC do servidor','binary_sensor.servidor_grafana_respondendo':'o Grafana','binary_sensor.servidor_influxdb_respondendo':'o
            InfluxDB'}[trigger.entity_id] }} voltou a responder depois de {{ ((trigger.to_state.last_changed
            - trigger.from_state.last_changed).total_seconds() / 60) | round(0) |
            int }} min.
  mode: parallel
