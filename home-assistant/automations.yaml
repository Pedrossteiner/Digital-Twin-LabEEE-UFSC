  - trigger: state
    entity_id:
    - binary_sensor.1a_contact
    - binary_sensor.2a_contact
    - binary_sensor.3a_contact
    - binary_sensor.4a_contact
    - binary_sensor.5a_contact
    - binary_sensor.6a_contact
    - binary_sensor.7a_contact
    - binary_sensor.8a_contact
    - binary_sensor.9a_contact
    - binary_sensor.10a_contact
    - binary_sensor.11a_contact
    - binary_sensor.12a_contact
    - binary_sensor.1b_contact
    - binary_sensor.2b_contact
    - binary_sensor.3b_contact
    - binary_sensor.4b_contact
    - binary_sensor.5b_contact
    - binary_sensor.6b_contact
    - binary_sensor.7b_contact
    - binary_sensor.8b_contact
    - binary_sensor.9b_contact
    - binary_sensor.c1_contact
    - binary_sensor.c2_contact
    - binary_sensor.c3_contact
    - binary_sensor.ap1_contact
    - binary_sensor.ap2_contact
    - binary_sensor.ap3_contact
    - binary_sensor.1r1_contact
    - binary_sensor.2r1_contact
    - binary_sensor.3r1_contact
    - binary_sensor.1r2_contact
    - binary_sensor.2r2_contact
    - binary_sensor.3r2_contact
    - binary_sensor.po1_contact
    - binary_sensor.pc_contact
    - binary_sensor.pr1_contact
    - binary_sensor.pr2_contact
    - binary_sensor.plb_contact
    to:
    - unavailable
    - unknown
    for:
      hours: 24
      minutes: 0
      seconds: 0
  actions:
  - action: notify.labeee
    data:
      message: "\U0001FA9F *Sensor de janela/porta fora do ar há 24 h* — {{ trigger.to_state.name
        }} está indisponível desde {{ trigger.to_state.last_changed | as_local | as_timestamp
        | timestamp_custom('%d/%m %H:%M') }}. Costuma voltar quando a janela é aberta
        e fechada; se não voltar, confira a bateria."
      target:
      - SLACK_ID_PESSOA_2
      - SLACK_ID_PESSOA_1
  mode: parallel
- id: '1792067659199'
  alias: Publicar HOBO no MQTT
  description: Publica temperatura, umidade e CO2 dos Onset no broker local
  triggers:
  - entity_id:
    - sensor.onset20589702
    - sensor.onset20589706
    - sensor.onset20589709
    - sensor.onset20589716
    - sensor.onset20589717
    - sensor.onset20589721
    - sensor.onset20589722
    - sensor.onset20589725
    - sensor.onset20589729
    - sensor.onset20589732
    - sensor.onset20589733
    - sensor.onset20589744
    - sensor.onset20589761
    - sensor.onset20589763
    - sensor.onset20589766
    - sensor.onset20590558
    - sensor.onset20590559
    - sensor.onset20590561
    - sensor.onset20590562
    - sensor.onset20590564
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ state_attr(trigger.entity_id, ''Temperature'') is not none
      }}'
  actions:
  - data:
      topic: lab/hobo/{{ trigger.entity_id.split('.')[1] | replace('onset','') }}
      payload: '{% set s = trigger.entity_id.split(''.'')[1] | replace(''onset'','''')
        %}{% set t = state_attr(trigger.entity_id, ''Temperature'') | float %}{% set
        h = state_attr(trigger.entity_id, ''RH'') | float %}{% set c = state_attr(trigger.entity_id,
        ''CO2'') %}{% if c is none %}{{ {''serie'': s, ''temp_c'': t, ''ur_pct'':
        h} | to_json }}{% else %}{{ {''serie'': s, ''temp_c'': t, ''ur_pct'': h, ''co2_ppm'':
        c | float} | to_json }}{% endif %}'
    action: mqtt.publish
  mode: queued
  max: 40
