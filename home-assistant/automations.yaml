  - action: notify.labeee
    data:
      title: Ar ligado com janela aberta
      message: '⚠️ *Ar ligado com janela aberta* — Ar ligado: {{ ([''climate.daikin_1_02'',
        ''climate.daikin_1_03'', ''climate.daikin_1_04'', ''climate.daikin_1_05'',
