- id: '1769191354876'
  alias: Notificação de Indisponível do Daikin
  description: Avisa no Slack (Pedro e Léo) qual Daikin ficou indisponível e onde
    ele fica.
  triggers:
  - trigger: state
    entity_id:
    - sensor.daikin_1_00_state
    - sensor.daikin_1_01_state
    - sensor.daikin_1_02_state
    - sensor.daikin_1_03_state
    - sensor.daikin_1_04_state
    - sensor.daikin_1_05_state
    - sensor.daikin_1_06_state
    - sensor.daikin_1_07_state
    - sensor.daikin_1_08_state
    to:
    - unavailable
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions: []
  actions:
  - action: notify.labeee
    data:
      title: Daikin indisponível
      message: '{% set u = trigger.entity_id.split(''.'')[1].replace(''daikin_'','''').replace(''_state'','''').replace(''_'',''-'')
        %}{% set locais = {''1-00'':''Sala de reunião 1'',''1-01'':''Sala de reunião
        2'',''1-02'':''Salão, bancada B1, mesas 51–54/61–64'',''1-03'':''Salão, bancada
        B2, mesas 31–34/41–44'',''1-04'':''Salão, bancada B3, mesas 11–14/21–24'',''1-05'':''Salão,
        bancada B5, mesas 35–37/45–47'',''1-06'':''Salão, bancada B4, mesas 15–17/25–27'',''1-07'':''Sala
        da Ana Paula'',''1-08'':''Sala do Lamberts''} %}⚠️ O ar-condicionado Daikin
        {{ u }} ({{ locais.get(u, ''local desconhecido'') }}) ficou indisponível às
        {{ now().strftime(''%H:%M'') }}.'
      target:
      - SLACK_ID_PESSOA_1
      - SLACK_ID_PESSOA_2
  mode: parallel
- id: '1770065074292'
  alias: Automação de Reinicialização Forçada Daikin
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - climate.daikin_1_00
    to:
    - unavailable
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions: []
  actions:
  - action: script.slack_notificar_indisponivel_daikin
    metadata: {}
    data: {}
  - action: homeassistant.reload_config_entry
    target:
      entity_id: climate.daikin_1_00
    data: {}
  - delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  - choose:
    - conditions:
      - condition: state
        entity_id: climate.daikin_1_00
        state:
        - unavailable
      sequence:
      - action: notify.labeee
        data:
          message: ⚠️ Falha na recuperação. O Daikin continua fora do ar. Verificar
            manualmente.
          title: Falha Crítica Daikin
          target:
          - SLACK_ID_PESSOA_2
          - SLACK_ID_PESSOA_1
    default:
    - action: notify.labeee
      data:
        message: ✅ Sistema recuperado! O Daikin voltou a funcionar sozinho.
        title: Recuperação Automática
        target:
        - SLACK_ID_PESSOA_2
        - SLACK_ID_PESSOA_1
  mode: single
