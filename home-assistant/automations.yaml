      | reject(''is_state'', ''unavailable'') | reject(''is_state'', ''unknown'')
      | list) | count > 0 and ([''binary_sensor.1a_contact'', ''binary_sensor.2a_contact'',
      ''binary_sensor.3a_contact'', ''binary_sensor.4a_contact'', ''binary_sensor.5a_contact'',
      ''binary_sensor.6a_contact'', ''binary_sensor.7a_contact'', ''binary_sensor.8a_contact'',
